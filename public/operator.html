<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Student Referrals</title>
<style>
:root{
  --navy:#0d1a2e;--gold:#B8966E;--gold-lt:#D4B896;--gold-soft:rgba(184,150,110,.14);--cream:#FBF8F2;
  --ink:#1a1a1a;--muted:#8a8a8a;--line:#e7e2d9;--panel:#fff;--bg:#F3F0EA;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:Baskerville,Georgia,serif;font-weight:400;letter-spacing:-.01em;margin:0}

/* ── sign in ─────────────────────────────────────────── */
#gate{min-height:100vh;display:grid;place-items:center;padding:24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:34px 32px;width:100%;max-width:380px;box-shadow:0 18px 50px rgba(13,26,46,.09)}
.card .mark{text-align:center;margin-bottom:20px}
.card .mark img{height:16px;width:auto;filter:invert(1)}
.card h1{font-size:21px;text-align:center;margin-bottom:6px}
.card p.sub{margin:0 0 22px;text-align:center;font-size:12.5px;color:var(--muted)}
label{display:block;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font:inherit;font-size:16px;background:var(--cream);margin-bottom:15px}
input:focus{outline:none;border-color:var(--gold);background:#fff}
button.primary{width:100%;padding:12px;border:0;border-radius:9px;background:var(--navy);color:#fff;font:inherit;font-size:13px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
button.primary:hover{background:#16294a}
button.primary:disabled{opacity:.55;cursor:default}
.err{margin:12px 0 0;font-size:12.5px;color:#c0392b;text-align:center;min-height:16px}

/* ── shell ───────────────────────────────────────────── */
#app{display:none}
.top{background:#000;color:#fff;padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.top img{height:14px;width:auto}
.top .who{flex:1;min-width:150px}
.top .who span{display:block;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.top .who b{display:block;font-family:Baskerville,Georgia,serif;font-size:17px;font-weight:400}
.top .out{background:none;border:1px solid rgba(255,255,255,.25);color:rgba(255,255,255,.8);border-radius:8px;padding:7px 13px;font:inherit;font-size:12px;cursor:pointer}
.top .out:hover{border-color:var(--gold);color:#fff}

.bar{background:var(--panel);border-bottom:1px solid var(--line);padding:11px 24px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.search{position:relative;min-width:170px;flex:0 1 260px}
.search input{margin:0;padding:8px 12px 8px 30px;font-size:13px;border-radius:9px}
.search svg{position:absolute;left:9px;top:9px;width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:1.7}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 13px;font-size:12px;color:#555;cursor:pointer}
.chip.on{background:var(--gold-soft);border-color:rgba(184,150,110,.5);color:#8a6540;font-weight:500}
.spacer{flex:1}
.ghost{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 13px;font-size:12.5px;cursor:pointer}
.ghost:hover{border-color:var(--gold)}
.sync{font-size:11.5px;color:var(--muted)}

.wrap{padding:20px 24px 60px;max-width:1440px;margin:0 auto}
.group{margin-bottom:16px;background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden}
.ghead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.ghead .dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.ghead b{font-size:13.5px;font-weight:500}
.ghead .n{font-size:11.5px;color:var(--muted);background:var(--cream);border:1px solid var(--line);border-radius:99px;padding:2px 9px}
.ghead .caret{margin-left:auto;color:var(--muted);font-size:11px}
.group.shut .gbody{display:none}
table{width:100%;border-collapse:collapse}
thead th{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:400;text-align:left;padding:9px 16px;background:var(--cream);border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:11px 16px;border-bottom:1px solid #f1ede6;font-size:13px;vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fdfbf7}
.stu{display:flex;align-items:flex-start;gap:10px}
.stu .av{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:10.5px;font-weight:500;flex-shrink:0}
.stu b{font-weight:500;display:block;font-size:13px}
.stu span{display:block;font-size:11.5px;color:var(--muted)}
.contact a{display:block;color:var(--ink);text-decoration:none;font-size:12.5px;white-space:nowrap}
.contact a:hover{color:var(--gold);text-decoration:underline}
.contact .pref{display:inline-block;margin-top:4px;font-size:10.5px;border:1px solid rgba(184,150,110,.45);background:var(--gold-soft);color:#8a6540;border-radius:99px;padding:2px 8px}
.pill{display:inline-block;padding:4px 11px;border-radius:99px;font-size:11.5px;font-weight:500;border:1px solid rgba(184,150,110,.45);background:var(--gold-soft);color:#8a6540;white-space:nowrap}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;white-space:nowrap}
.st i{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.dim{color:var(--muted);font-size:12px}
.msg{margin-top:6px;font-size:11.5px;color:var(--muted);font-style:italic;line-height:1.5;max-width:260px}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:12.5px}
.loading{padding:60px 0;text-align:center;color:var(--muted);font-size:13px}
.foot-note{margin-top:20px;font-size:11.5px;color:var(--muted);line-height:1.7;text-align:center}
.hidden{display:none!important}
@media(max-width:900px){
  .wrap{padding:14px 12px 50px}
  .bar{padding:10px 12px}
  .tblwrap{overflow-x:auto}
  table{min-width:1000px}
}
</style>
</head>
<body>

<!-- ── SIGN IN ─────────────────────────────────────────── -->
<div id="gate">
  <form class="card" id="loginForm" autocomplete="on">
    <div class="mark">
      <img src="https://images.squarespace-cdn.com/content/5de66dfc5511bf790e4476bd/3b2d0218-5cf8-4041-8460-2ec2228c864b/Logo+White+website.png?content-type=image%2Fpng" alt="Student Luxe">
    </div>
    <h1>Student Referrals</h1>
    <p class="sub">Sign in to see the students we are sending your way</p>
    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button class="primary" type="submit" id="signin">Sign in</button>
    <p class="err" id="err"></p>
  </form>
</div>

<!-- ── DASHBOARD ───────────────────────────────────────── -->
<div id="app">
  <div class="top">
    <img src="https://images.squarespace-cdn.com/content/5de66dfc5511bf790e4476bd/3b2d0218-5cf8-4041-8460-2ec2228c864b/Logo+White+website.png?content-type=image%2Fpng" alt="Student Luxe">
    <div class="who">
      <span>Student referrals</span>
      <b id="topName">&nbsp;</b>
    </div>
    <button class="out" id="signout">Sign out</button>
  </div>

  <div class="bar">
    <div class="search">
      <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><line x1="10.5" y1="10.5" x2="14" y2="14"/></svg>
      <input id="q" placeholder="Search students or buildings">
    </div>
    <div id="chips"></div>
    <div class="spacer"></div>
    <button class="ghost" id="csv">Export CSV</button>
    <button class="ghost" id="refresh">Refresh</button>
    <span class="sync" id="sync"></span>
  </div>

  <div class="wrap">
    <div class="loading" id="loading">Loading referrals&hellip;</div>
    <div id="board"></div>
    <p class="foot-note">Enquiries come from Student Luxe students who asked about your buildings. Contact details are shared so you can follow up directly. Please use them only for this enquiry.</p>
  </div>
</div>

<script>
(function () {
  var TOKEN_KEY = 'sl_operator_token';
  var state = { data: null, q: '', filter: 'all', shut: {} };

  function token ()     { try { return sessionStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } }
  function setToken (t) { try { t ? sessionStorage.setItem(TOKEN_KEY, t) : sessionStorage.removeItem(TOKEN_KEY); } catch (e) {} }
  function esc (s)      { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function initials (name) {
    var p = String(name || '').trim().split(/\s+/).filter(Boolean);
    if (!p.length) return '?';
    return (p[0][0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase();
  }
  function fmtDate (d) {
    if (!d) return '';
    var t = new Date(d);
    return isNaN(t) ? d : t.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }
  function ago (d) {
    if (!d) return '';
    var m = Math.round((Date.now() - new Date(d)) / 60000);
    if (isNaN(m)) return '';
    if (m < 60) return m + ' min ago';
    if (m < 1440) return Math.round(m / 60) + ' hr ago';
    var days = Math.round(m / 1440);
    return days < 30 ? days + (days === 1 ? ' day ago' : ' days ago') : fmtDate(d);
  }
  function weeks (n) { return n ? Math.round(n / 7) + ' weeks' : ''; }

  /* The path names the operator, so /yugo fills the username in and they
     only have to type a password. */
  var pathUser = { '/yugo': 'yugo', '/urbanest': 'urbanest' }[location.pathname.replace(/\/$/, '')];
  if (pathUser) document.getElementById('u').value = pathUser;

  var form = document.getElementById('loginForm');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = document.getElementById('signin'), err = document.getElementById('err');
    err.textContent = '';
    btn.disabled = true; btn.textContent = 'Signing in';
    fetch('/api/partner-login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: document.getElementById('u').value, password: document.getElementById('p').value })
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.j.error || 'Sign in failed.');
        setToken(res.j.token);
        document.getElementById('p').value = '';
        start();
      })
      .catch(function (e2) { err.textContent = e2.message; })
      .then(function () { btn.disabled = false; btn.textContent = 'Sign in'; });
  });

  document.getElementById('signout').addEventListener('click', function () { setToken(''); location.reload(); });

  function load (refresh) {
    document.getElementById('loading').classList.remove('hidden');
    return fetch('/api/partner-leads' + (refresh ? '?refresh=1' : ''), { headers: { Authorization: 'Bearer ' + token() } })
      .then(function (r) {
        if (r.status === 401) { setToken(''); location.reload(); return null; }
        return r.json();
      })
      .then(function (data) {
        if (!data) return;
        state.data = data;
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('topName').textContent = data.partner.name;
        document.getElementById('sync').textContent = 'Synced ' + ago(data.synced);
        buildChips();
        render();
      })
      .catch(function () { document.getElementById('loading').textContent = 'Could not load referrals. Try Refresh.'; });
  }

  function allLeads () {
    if (!state.data) return [];
    return state.data.groups.reduce(function (a, g) { return a.concat(g.leads); }, []);
  }

  /* Filter chips are the buildings actually enquired about, so a new
     building appears here on its own. */
  function buildChips () {
    var b = {};
    allLeads().forEach(function (l) { if (l.building) b[l.building] = (b[l.building] || 0) + 1; });
    var names = Object.keys(b).sort(function (x, y) { return b[y] - b[x]; });
    var html = '<button class="chip' + (state.filter === 'all' ? ' on' : '') + '" data-f="all">All buildings</button>';
    names.forEach(function (n) {
      html += '<button class="chip' + (state.filter === n ? ' on' : '') + '" data-f="' + esc(n) + '">' + esc(n) + ' (' + b[n] + ')</button>';
    });
    var box = document.getElementById('chips');
    box.innerHTML = html;
    box.querySelectorAll('.chip').forEach(function (c) {
      c.addEventListener('click', function () { state.filter = c.dataset.f; buildChips(); render(); });
    });
  }

  function visible (leads) {
    var q = state.q.toLowerCase();
    return leads.filter(function (l) {
      if (state.filter !== 'all' && l.building !== state.filter) return false;
      if (!q) return true;
      return [l.name, l.building, l.university, l.email, l.areas, l.city].join(' ').toLowerCase().indexOf(q) !== -1;
    });
  }

  function row (l, colour) {
    var tel = (l.phone || '').replace(/\s/g, '');
    return '<tr>' +
      '<td><div class="stu"><div class="av">' + esc(initials(l.name)) + '</div><div>' +
        '<b>' + esc(l.name) + '</b><span>Enquired ' + esc(fmtDate(l.created)) + '</span>' +
        (l.message ? '<div class="msg">&ldquo;' + esc(l.message) + '&rdquo;</div>' : '') +
      '</div></div></td>' +
      '<td class="contact">' +
        (l.email ? '<a href="mailto:' + esc(l.email) + '">' + esc(l.email) + '</a>' : '') +
        (l.phone ? '<a href="tel:' + esc(tel) + '">' + esc(l.phone) + '</a>' : '') +
        (l.prefers ? '<span class="pref">' + esc(l.prefers) + '</span>' : '') +
      '</td>' +
      '<td>' + (l.university ? esc(l.university) : '<span class="dim">Not given</span>') + '</td>' +
      '<td>' + (l.building ? '<span class="pill">' + esc(l.building) + '</span>' : '<span class="dim">Not specified</span>') + '</td>' +
      '<td>' + esc(fmtDate(l.checkIn)) + '</td>' +
      '<td class="dim">' + esc(weeks(l.nights)) + '</td>' +
      '<td class="dim">' + esc(l.budget || '') + '</td>' +
      '<td><span class="st"><i style="background:' + esc(colour) + '"></i>' + esc(l.status) + '</span></td>' +
      '<td class="dim">' + esc(ago(l.updated)) + '</td>' +
    '</tr>';
  }

  function render () {
    if (!state.data) return;
    var html = '';
    state.data.groups.forEach(function (g) {
      var leads = visible(g.leads);
      var shut = state.shut[g.title] ? ' shut' : '';
      html += '<div class="group' + shut + '" data-g="' + esc(g.title) + '">' +
        '<div class="ghead"><span class="dot" style="background:' + esc(g.colour) + '"></span>' +
        '<b>' + esc(g.title) + '</b><span class="n">' + leads.length + '</span><span class="caret">' + (shut ? '&#9656;' : '&#9662;') + '</span></div>' +
        '<div class="gbody">';
      if (!leads.length) {
        html += '<div class="empty">Nothing here right now</div>';
      } else {
        html += '<div class="tblwrap"><table><thead><tr>' +
          '<th style="width:24%">Student</th><th>Contact</th><th>University</th><th>Building</th><th>Move in</th><th>Stay</th><th>Budget</th><th>Status</th><th>Updated</th>' +
          '</tr></thead><tbody>' + leads.map(function (l) { return row(l, g.colour); }).join('') + '</tbody></table></div>';
      }
      html += '</div></div>';
    });
    document.getElementById('board').innerHTML = html;
    document.querySelectorAll('.ghead').forEach(function (h) {
      h.addEventListener('click', function () {
        var t = h.parentElement.dataset.g;
        state.shut[t] = !state.shut[t];
        render();
      });
    });
  }

  document.getElementById('q').addEventListener('input', function (e) { state.q = e.target.value; render(); });
  document.getElementById('refresh').addEventListener('click', function () { load(true); });

  document.getElementById('csv').addEventListener('click', function () {
    var rows = [['Student', 'Email', 'Phone', 'Prefers', 'University', 'Building', 'Move in', 'Move out', 'Weeks', 'Budget', 'Status', 'Enquired']];
    state.data.groups.forEach(function (g) {
      visible(g.leads).forEach(function (l) {
        rows.push([l.name, l.email, l.phone, l.prefers, l.university, l.building, l.checkIn, l.checkOut,
                   l.nights ? Math.round(l.nights / 7) : '', l.budget, l.status, (l.created || '').slice(0, 10)]);
      });
    });
    var csv = rows.map(function (r) {
      return r.map(function (c) { return '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"'; }).join(',');
    }).join('\n');
    var url = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    var a = document.createElement('a');
    a.href = url;
    a.download = 'student-referrals-' + new Date().toISOString().slice(0, 10) + '.csv';
    a.click();
    URL.revokeObjectURL(url);
  });

  function start () {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    load(false);
  }

  if (token()) start();
})();
</script>
</body>
</html>
